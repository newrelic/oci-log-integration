---
title: "New Relic Log Integration for OCI"
description: >
  Forward logs from OCI Log Groups to New Relic using OCI Functions
  and Service Connector Hub
schemaVersion: 1.1.0
version: "1.2.0"
locale: "en"
variableGroups:
  - title: "New Relic Environment Configuration"
    visible: true
    variables:
      - ${new_relic_region}
      - ${newrelic_logging_identifier}
      - ${newrelic_account_id}
      - ${payload_link}
      - ${metrics_tier}

  - title: "Network options"
    variables:
      - ${create_vcn}
      - ${vcnCompartment}
      - ${existingVcn}
      - ${function_subnet_id}

  - title: "Function image"
    variables:
      - ${function_image}
      - ${registry_username}
      - ${registry_auth_token}

  - title: "Hidden"
    visible: false
    variables:
      - ${current_user_ocid}

variables:
  tenancy_ocid:
    type: string
    title: "Tenancy OCID"
    description: "OCI tenant OCID, more details can be found at https://docs.cloud.oracle.com/en-us/iaas/Content/API/Concepts/apisigningkey.htm#five"
    required: true
    visible: false
  
  compartment_ocid:
    type: string
    title: Compartment OCID
    description: The OCID of the compartment where the resources will be created.
    required: true
    visible: false

  region:
    type: string
    title: "Region"
    description: "OCI Region as documented at https://docs.cloud.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm"
    required: true
    visible: false

  newrelic_logging_identifier:
    type: string
    title: New Relic logging prefix
    description: A unique label or name identifier for all resources in this deployment. Leave it blank if not needed.
    required: true
    default: logs

  new_relic_region:
    type: enum
    title: "New Relic Region. US, EU, or JP"
    description: "Datacenter where the data will be sent (US/EU/JP)"
    required: true
    default: "US"
    enum:
      - "US"
      - "EU"
      - "JP"

  newrelic_account_id:
    type: string
    title: New Relic Account ID
    description: The New Relic Account ID for linking the OCI account to the New Relic account
    required: true
    sensitive: true
    confirmation: true
    
  create_vcn:
    title: Create VCN
    description: Create virtual network (VCN) for the function setup. If using existing networking resources, de-select "Create VCN" and select the relevant VCN and subnet to use.
    type: boolean
    default: true

  payload_link:
    title: Payload Link
    description: The link to the payload for the connector hubs.
    type: string
    required: true
    default: logs
  
  image_version:
    title: Docker Image Version
    description: Deprecated, no longer used. Superseded by Function image below.
    type: string
    required: true
    default: latest
    visible: false

  function_image:
    type: string
    title: Function image
    description: Public image for the log-forwarder function. The stack copies it into a private Container Registry repository in this tenancy. Re-apply the stack to pick up a new image pushed under the same tag.
    required: true
    default: docker.io/newrelic/oci-log-forwarder:latest

  registry_username:
    type: string
    title: Container Registry username
    description: Optional. Username without the tenancy namespace; defaults to the user running the stack. Set / for users in a non-default identity domain.
    required: false

  registry_auth_token:
    type: password
    title: Container Registry auth token
    description: Optional. Existing auth token used to push the image. Leave empty to have the stack create one for the user running it (OCI allows at most two per user).
    required: false

  current_user_ocid:
    type: string
    title: Current user OCID
    description: Populated by Resource Manager.
    required: false
    visible: false

  metrics_tier:
    type: enum
    title: "Forwarder metrics tier"
    description: Tier of custom metrics the function emits about itself (none/basic/advanced).
    required: true
    default: "basic"
    enum:
      - "none"
      - "basic"
      - "advanced"

  vcnCompartment:
    type: oci:identity:compartment:id
    visible:
      not:
        - ${create_vcn}
  existingVcn:
    type: oci:core:vcn:id
    visible:
      not:
        - ${create_vcn}
    dependsOn:
      compartmentId: ${vcnCompartment}
  function_subnet_id:
    title: Function Subnet OCID
    type: oci:core:subnet:id
    visible:
      not:
        - ${create_vcn}
    description: The subnet to be used by the function app that will be deployed. If "Create VCN" is selected, the new VCN will overwrite this selection..
    required: false
    dependsOn:
      compartmentId: ${vcnCompartment}
      vcnId: ${existingVcn}