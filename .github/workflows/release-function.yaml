name: Build and Deploy OCI Go Function Image

on:
  push:
    branches:
      - main
    paths:
      - 'logs-function/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'logs-function/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_docker_image:
    runs-on: ubuntu-latest
    environment:
      name: build-test-env
    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set permissions for build script
        run: chmod +x scripts/build_image.sh

      - name: Build Docker Image
        run: ./scripts/build_image.sh

  push_docker_image:
    runs-on: ubuntu-latest
    needs: build_docker_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        region:
          - us-ashburn-1
          - us-phoenix-1
          - ap-batam-1
          - ap-sydney-1
          - ap-melbourne-1
          - sa-saopaulo-1
          - sa-vinhedo-1
          - ca-montreal-1
          - ca-toronto-1
          - sa-santiago-1
          - sa-valparaiso-1
          - sa-bogota-1
          - eu-paris-1
          - eu-marseille-1
          - eu-frankfurt-1
          - ap-hyderabad-1
          - ap-mumbai-1
          - il-jerusalem-1
          - eu-milan-1
          - ap-osaka-1
          - ap-tokyo-1
          - mx-queretaro-1
          - mx-monterrey-1
          - eu-amsterdam-1
          - me-riyadh-1
          - me-jeddah-1
          - ap-singapore-1
          - ap-singapore-2
          - af-johannesburg-1
          - ap-seoul-1
          - ap-chuncheon-1
          - eu-madrid-1
          - eu-stockholm-1
          - eu-zurich-1
          - me-abudhabi-1
          - me-dubai-1
          - uk-london-1
          - uk-cardiff-1
          - us-chicago-1
          - us-sanjose-1
    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set permissions for build script
        run: chmod +x scripts/build_and_push_image.sh

      - name: Push Docker Image to ${{ matrix.region }}
        run: ./scripts/build_and_push_image.sh ${{ matrix.region }}
        env:
          ORACLE_AUTH_TOKEN: ${{ secrets.ORACLE_AUTH_TOKEN }}
          OCI_REGION: ${{ matrix.region }}
          OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}

  # Publishes the canonical image to Docker Hub. Customer stacks copy this image into
  # their own OCIR at apply time (see terraform/image_mirror.py) instead of pulling
  # directly from the region matrix above, which stays in place during the migration.
  push_dockerhub_image:
    runs-on: ubuntu-latest
    needs: build_docker_image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: build-test-env
    permissions:
      contents: write
    steps:

      - name: Set FUNCTION_BUILD_VERSION
        run: |
          major=1
          minor=$((1 + ${{ github.run_number }}))
          echo "FUNCTION_BUILD_VERSION=${major}.${minor}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set permissions for publish script
        run: chmod +x scripts/push_dockerhub_image.sh

      - name: Push Docker Image to Docker Hub
        id: push_dockerhub
        run: ./scripts/push_dockerhub_image.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: newrelic/oci-log-forwarder
          FUNCTION_BUILD_VERSION: ${{ env.FUNCTION_BUILD_VERSION }}

      # SLC-recommended digest pinning (SLCREV-1730): the released stack should ship
      # pinned to the exact image this run just pushed, not a floating :latest tag.
      # Only on real pushes to main -- not on a manual workflow_dispatch test run --
      # so this commit lands in lockstep with the release-terraform.yaml zip it feeds.
      - name: Pin function_image default to the pushed digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          digest_ref="${{ steps.push_dockerhub.outputs.image_digest_ref }}"
          # Scoped to the function_image block only -- variables.tf has several other
          # `default = ...` lines (image_version, create_vcn, metrics_tier, ...) that
          # an unscoped substitution would corrupt. Uses awk, not sed -E, because BSD
          # and GNU sed disagree on brace-escaping for the block-boundary match.
          awk -v ref="${digest_ref}" '
            /variable "function_image" \{/ { in_block=1 }
            in_block && /default[ \t]*=/ { sub(/default[ \t]*=.*/, "default     = \"" ref "\""); in_block=0 }
            { print }
          ' terraform/variables.tf > terraform/variables.tf.tmp
          mv terraform/variables.tf.tmp terraform/variables.tf
          if git diff --quiet -- terraform/variables.tf; then
            echo "terraform/variables.tf already pinned to ${digest_ref} -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/variables.tf
          git commit -m "Pin function_image default to ${digest_ref} [skip ci]"
          git push origin HEAD:main