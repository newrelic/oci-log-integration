name: Build and Deploy OCI Go Function Image

on:
  push:
    branches:
      - main
    paths:
      - 'logs-function/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'logs-function/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_docker_image:
    runs-on: ubuntu-latest
    environment:
      name: build-test-env
    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set permissions for build script
        run: chmod +x scripts/build_image.sh

      - name: Build Docker Image
        run: ./scripts/build_image.sh

  push_docker_image:
    runs-on: ubuntu-latest
    needs: build_docker_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        region:
          - us-ashburn-1
          - us-phoenix-1
          - ap-batam-1
          - ap-sydney-1
          - ap-melbourne-1
          - sa-saopaulo-1
          - sa-vinhedo-1
          - ca-montreal-1
          - ca-toronto-1
          - sa-santiago-1
          - sa-valparaiso-1
          - sa-bogota-1
          - eu-paris-1
          - eu-marseille-1
          - eu-frankfurt-1
          - ap-hyderabad-1
          - ap-mumbai-1
          - il-jerusalem-1
          - eu-milan-1
          - ap-osaka-1
          - ap-tokyo-1
          - mx-queretaro-1
          - mx-monterrey-1
          - eu-amsterdam-1
          - me-riyadh-1
          - me-jeddah-1
          - ap-singapore-1
          - ap-singapore-2
          - af-johannesburg-1
          - ap-seoul-1
          - ap-chuncheon-1
          - eu-madrid-1
          - eu-stockholm-1
          - eu-zurich-1
          - me-abudhabi-1
          - me-dubai-1
          - uk-london-1
          - uk-cardiff-1
          - us-chicago-1
          - us-sanjose-1
    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set permissions for build script
        run: chmod +x scripts/build_and_push_image.sh

      - name: Push Docker Image to ${{ matrix.region }}
        run: ./scripts/build_and_push_image.sh ${{ matrix.region }}
        env:
          ORACLE_AUTH_TOKEN: ${{ secrets.ORACLE_AUTH_TOKEN }}
          OCI_REGION: ${{ matrix.region }}
          OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}

  release_function:
    runs-on: ubuntu-latest
    needs: push_docker_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # Required to create tags and releases
      contents: write
    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Read function version
        id: version
        run: echo "value=$(tr -d '[:space:]' < logs-function/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "function-${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: function-${{ steps.version.outputs.value }}
          name: "oci-log-forwarder function ${{ steps.version.outputs.value }}"
          body: |
            OCI log forwarder function image, published to OCIR in every region as `${{ steps.version.outputs.value }}` and `latest`.

            Leave `image_version` as `latest` to always use the newest function, or set it to `${{ steps.version.outputs.value }}` to pin this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
